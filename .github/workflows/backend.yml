name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'api-service/**'
      - 'worker-service/**'
      - 'core-libs/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'api-service/**'
      - 'worker-service/**'
      - 'core-libs/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - '.github/workflows/backend.yml'

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Package with Maven Wrapper
      run: ./mvnw clean package -B -DskipTests
